name: trailpulse
description: "TrailPulse - Tactical Offline Navigation & 3D Telemetry OS for Cyclists & Hikers"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.20.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  latlong2: ^0.9.1
  vector_math: ^2.1.4
  intl: ^0.19.0
  provider: ^6.1.2
  file_picker: ^8.1.7
  xml: ^6.5.0
  flutter_map: ^7.0.2
  http: ^1.6.0
  permission_handler: ^11.3.1
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/styles/
    - assets/fonts/
    - stitch_assets/3d_cockpit/
